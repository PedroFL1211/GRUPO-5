{% extends "registration/reset_base.html" %}
{% block content %}
<h1>Esqueceu sua senha?</h1><p>Informe o e-mail cadastrado para recuperar o acesso.</p>
<form method="post">{% csrf_token %}{{ form.non_field_errors }}<div class="input-group"><label for="id_email">E-mail</label>{{ form.email.errors }}{{ form.email }}</div><button class="btn-primary" type="submit">Enviar link de recuperação</button></form>
{% endblock %}
