<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notificações - Desenrola</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
    .topo { display: flex; justify-content: space-between; align-items: center; }
    .item { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid #ddd; }
    .item.nao-lida { font-weight: bold; }
    .item small { color: #777; font-weight: normal; }
    .nova_solicitacao .tipo { color: #185FA5; }
    .sessao_aceita .tipo { color: #3B6D11; }
    .sessao_recusada .tipo { color: #A32D2D; }
  </style>
</head>
<body>
  <div class="topo">
    <h1>Notificações</h1>
    <a href="{% url 'marcar_todas_lidas' %}">Marcar todas como lidas</a>
  </div>

  {% for n in notificacoes %}
    <div class="item {{ n.tipo }} {% if not n.lida %}nao-lida{% endif %}">
      <div>
        <div class="tipo">{{ n.get_tipo_display }}</div>
        <div>{{ n.mensagem }}</div>
        <small>{{ n.criada_em|timesince }} atrás</small>
      </div>
      {% if not n.lida %}
        <a href="{% url 'marcar_lida' n.pk %}">Marcar como lida</a>
      {% else %}
        <small>Lida</small>
      {% endif %}
    </div>
  {% empty %}
    <p>Você não tem notificações.</p>
  {% endfor %}
    {% include "_rodape.html" %}
</body>
</html>
