<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remover Usuário - Desenrola</title>
    <style>
        .danger-zone {
            background-color: #fff9f9;
            border: 2px solid #ff4d4f;
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            margin: 40px auto;
            font-family: sans-serif;
        }

        .danger-zone h2 {
            color: #cf1322;
            margin-top: 0;
        }

        .danger-zone p {
            color: #595959;
            line-height: 1.6;
            font-size: 15px;
            margin-bottom: 25px;
        }

        .delete-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .delete-form label {
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }

        .delete-form input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .delete-form input:focus {
            border-color: #ff4d4f;
            outline: none;
        }

        .btn-danger {
            background-color: #ff4d4f;
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-danger:hover {
            background-color: #cf1322;
        }
    </style>
</head>
<body>
    <div class="danger-zone">
        <h2>Excluir Conta</h2>
        
        <p>
            <strong>Atenção:</strong> Esta ação é irreversível. Ao excluir sua conta no Desenrola, 
            você perderá permanentemente o acesso ao seu saldo de horas, histórico de mentorias, 
            grupos e todas as suas avaliações.
        </p>
      
        <form action="#" method="POST" class="delete-form">
            <label for="senha-confirmacao">Para continuar, digite sua senha atual:</label>
            <input type="password" id="senha-confirmacao" name="senha" placeholder="Sua senha" required>
            
            <button type="submit" class="btn-danger">Sim, excluir minha conta permanentemente</button>
        </form>
    </div>
</body>
</html>
