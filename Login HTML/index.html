<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Desenrola</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav>
        <h2>Desenrola</h2>
        <ul class="navegacao">
            <li><a href="index.html">Entrar</a></li>
            <li><a href="cadastro.html">Cadastre-se</a></li>
        </ul>
    </nav>

    <main>

        <section id="login">

            <img src="img/logo.png" alt="Logo do Desenrola">

            <h1>Entrar</h1>
            <h3>Desenrola, Ninguém Sabe Tudo</h3>

            <p>Entre com seu usuário e senha para acessar sua conta.</p>

            <form action="#" method="post">

                <label for="username">Usuário</label>
                <input type="text" id="username" name="username" placeholder="seu_usuario">

                <label for="password">Senha</label>
                <input type="password" id="password" name="password" placeholder="Sua senha">

                <ul class="opcoes-login">
                    <li><input type="checkbox" id="remember" name="remember"> <label for="remember">Lembrar de mim</label></li>
                    <li><a href="#">Esqueci minha senha</a></li>
                </ul>

                <button type="submit">Entrar</button>

            </form>

        </section>

    </main>

    <footer>
        <p>Desenrola — Projeto ENG4021 — PUC-Rio</p>
    </footer>

</body>
</html>
