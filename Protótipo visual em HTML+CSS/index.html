<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Desenrola</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav>
        <h2>Desenrola</h2>
        <ul class="navegacao">
            <li><a href="index.html">Entrar</a></li>
            <li><a href="cadastro.html">Cadastre-se</a></li>
        </ul>
    </nav>

    <main>

        <section id="login">

            <div class="logo-lockup">
                <img src="img/logo.png" alt="Logo do Desenrola" class="logo-img">
                <span class="logo-tagline">Ninguém Sabe Tudo</span>
            </div>

            <div class="login-card">

                <h1>Entrar</h1>
                <p class="subtitle">Bom te ver de novo por aqui.</p>

                <form action="#" method="post">

                    <label for="username">Usuário</label>
                    <input type="text" id="username" name="username" placeholder="seu_usuario">

                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" placeholder="Sua senha">

                    <ul class="opcoes-login">
                        <li><input type="checkbox" id="remember" name="remember"> <label for="remember">Lembrar de mim</label></li>
                        <li><a href="#">Esqueci minha senha</a></li>
                    </ul>

                    <button type="submit">Entrar</button>

                </form>

                <p class="divider">ou com o Google</p>

                <a href="#" class="btn-secondary">
                    <img src="img/google.png" alt="Ícone do Google" class="icon-google">
                    Entrar com Google
                </a>

                <p class="signup-footer">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>

            </div>

        </section>

    </main>

    <footer>
        <p>Desenrola — Projeto ENG4021 — PUC-Rio</p>
    </footer>

</body>
</html>
